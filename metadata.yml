Title: Entry-way rules (eNTRy) for gram-negative bacteria
Description: 'Applies the three eNTRy rules, checking whether a compound carries a primary amine, stays rigid with few rotatable bonds, and remains flat rather than globular. Richter and co-workers derived the criteria from accumulation measurements in Escherichia coli, then demonstrated their prospective value by converting deoxynybomycin, previously active only against Gram-positive organisms, into a compound with broad Gram-negative activity. The rules are structural filters, and meeting all three raises the odds of accumulation without guaranteeing antibacterial effect.'
